<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Mwaki University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-sidebar">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="top-header">
    <div class="logo-area">
      <img src="multimedia/mwaki_logo.png" data-fallback="https://placehold.co/60x60?text=Mwaki" alt="Mwaki University Logo">
      <p class="site-name">MWAKI UNIVERSITY</p>
    </div>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation menu">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <nav class="desktop-nav" id="site-nav" aria-label="Main">
      <a href="home.html">Home</a>
      <a href="faculties.html">Programs</a>
      <a href="admission.html">Admissions</a>
      <a href="tuition.html">Tuition</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="login.html" data-auth-link>Login</a>
    </nav>
  </header>

  <main class="main-wrapper" id="main">
    <h1 class="page-title"><i class="fas fa-user-circle" aria-hidden="true"></i> My Account</h1>
    <p class="page-subtitle" id="account-subtitle" role="status">Loading your account...</p>

    <section class="card account-card" id="accountCard" aria-labelledby="accountName" hidden>
      <div class="account-header">
        <i class="fas fa-user-circle account-avatar" aria-hidden="true"></i>
        <div>
          <h2 id="accountName"></h2>
          <p><span class="badge" id="accountRole"></span> &middot; Member since <span id="accountSince"></span></p>
        </div>
      </div>
      <div class="hero-buttons">
        <a href="e_students/students.html" class="btn"><i class="fas fa-users" aria-hidden="true"></i> Student manager</a>
        <a href="admin.html" class="btn"><i class="fas fa-inbox" aria-hidden="true"></i> Applications &amp; messages</a>
        <a href="home.html" class="btn btn-outline"><i class="fas fa-home" aria-hidden="true"></i> Back to Home</a>
        <button type="button" id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sign out</button>
      </div>
    </section>

    <section id="statsSection" aria-labelledby="statsTitle" hidden>
      <h2 id="statsTitle" class="section-title">Campus snapshot</h2>
      <div class="stat-grid" id="statGrid"></div>

      <div class="table-responsive">
        <table>
          <caption>Students and average grade per program</caption>
          <thead>
            <tr><th scope="col">Program</th><th scope="col">Students</th><th scope="col">Average grade</th></tr>
          </thead>
          <tbody id="programRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="details.js"></script>
</body>
</html>
