<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mwaki University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-sidebar">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="top-header">
    <div class="logo-area">
      <img src="multimedia/mwaki_logo.png" data-fallback="https://placehold.co/60x60?text=Mwaki" alt="Mwaki University Logo">
      <p class="site-name">MWAKI UNIVERSITY</p>
    </div>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation menu">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <nav class="desktop-nav" id="site-nav" aria-label="Main">
      <a href="home.html">Home</a>
      <a href="faculties.html">Programs</a>
      <a href="admission.html">Admissions</a>
      <a href="tuition.html">Tuition</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="login.html" data-auth-link>Login</a>
    </nav>
  </header>

  <main class="main-wrapper" id="main">
    <h1 class="page-title"><i class="fas fa-inbox" aria-hidden="true"></i> Applications &amp; Messages</h1>
    <p class="page-subtitle" id="adminSubtitle" role="status">Loading...</p>

    <div id="adminApp" hidden>
      <!-- Tabs: role="tablist" / "tab" / "tabpanel" tell screen readers this is one widget with two views. -->
      <div class="tabs" role="tablist" aria-label="Admin sections" id="tabList">
        <button type="button" role="tab" class="tab is-active" id="tab-applications" aria-selected="true" aria-controls="panel-applications">
          Applications <span class="tab-count" id="pendingCount"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-messages" aria-selected="false" aria-controls="panel-messages" tabindex="-1">
          Messages <span class="tab-count" id="newCount"></span>
        </button>
      </div>

      <section role="tabpanel" id="panel-applications" aria-labelledby="tab-applications">
        <div class="toolbar">
          <div>
            <label for="appStatus">Show</label>
            <select id="appStatus">
              <option value="">All applications</option>
              <option value="pending">Under review</option>
              <option value="approved">Approved</option>
              <option value="rejected">Not successful</option>
            </select>
          </div>
          <div>
            <label for="appSearch">Search</label>
            <input type="search" id="appSearch" placeholder="Name, email or reference" maxlength="100" autocomplete="off">
          </div>
        </div>
        <p class="status-note" id="appSummary" role="status"></p>
        <div class="table-responsive">
          <table class="admin-table">
            <caption class="visually-hidden">Admission applications</caption>
            <thead>
              <tr>
                <th scope="col">Reference</th><th scope="col">Applicant</th><th scope="col">Program / intake</th>
                <th scope="col">KCSE</th><th scope="col">Submitted</th><th scope="col">Status</th><th scope="col">Review</th>
              </tr>
            </thead>
            <tbody id="appRows"></tbody>
          </table>
        </div>
        <nav class="pager" id="appPager" aria-label="Application pages">
          <button type="button" class="btn btn-outline btn-small" data-dir="-1">&larr; Prev</button>
          <span class="pager-info" aria-live="polite"></span>
          <button type="button" class="btn btn-outline btn-small" data-dir="1">Next &rarr;</button>
        </nav>
      </section>

      <section role="tabpanel" id="panel-messages" aria-labelledby="tab-messages" hidden>
        <div class="toolbar">
          <div>
            <label for="msgFilter">Show</label>
            <select id="msgFilter">
              <option value="0">New messages</option>
              <option value="1">Handled messages</option>
              <option value="">All messages</option>
            </select>
          </div>
        </div>
        <p class="status-note" id="msgSummary" role="status"></p>
        <div class="message-list" id="messageList"></div>
        <nav class="pager" id="msgPager" aria-label="Message pages">
          <button type="button" class="btn btn-outline btn-small" data-dir="-1">&larr; Prev</button>
          <span class="pager-info" aria-live="polite"></span>
          <button type="button" class="btn btn-outline btn-small" data-dir="1">Next &rarr;</button>
        </nav>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="admin.js"></script>
</body>
</html>
