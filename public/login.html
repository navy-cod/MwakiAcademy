<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mwaki University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-sidebar">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="top-header">
    <div class="logo-area">
      <img src="multimedia/mwaki_logo.png" data-fallback="https://placehold.co/60x60?text=Mwaki" alt="Mwaki University Logo">
      <p class="site-name">MWAKI UNIVERSITY</p>
    </div>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation menu">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <nav class="desktop-nav" id="site-nav" aria-label="Main">
      <a href="home.html">Home</a>
      <a href="faculties.html">Programs</a>
      <a href="admission.html">Admissions</a>
      <a href="tuition.html">Tuition</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="login.html" class="active" aria-current="page" data-auth-link>Login</a>
    </nav>
  </header>

  <main class="main-wrapper login-layout" id="main">
    <!-- Login form. method="post" matters: with the old method="get" the password ended up in
         the address bar, browser history and server logs. The script below sends it with fetch(). -->
    <section class="form-card" aria-labelledby="login-title">
      <h1 id="login-title" class="form-title"><i class="fas fa-lock" aria-hidden="true"></i> Login Page</h1>

      <form id="loginForm" class="login-form" method="post">
        <div class="form-alert" data-form-error role="alert" hidden></div>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" maxlength="50" required>
        <p class="field-error" data-error-for="username" hidden></p>

        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" autocomplete="current-password" maxlength="200" required>
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </div>
        <p class="field-error" data-error-for="password" hidden></p>

        <div class="checkbox-group">
          <input type="checkbox" id="rememberUsername" name="rememberUsername">
          <label for="rememberUsername">Remember my username on this device</label>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn"><i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign in</button>
          <button type="reset" class="btn btn-outline"><i class="fas fa-undo" aria-hidden="true"></i> Reset</button>
        </div>
        <noscript><p class="form-alert">JavaScript is required to sign in.</p></noscript>
      </form>
    </section>

    <!-- Table -->
    <div class="card">
      <h2>Distance Between Points</h2>
      <table class="example-table">
        <tr><th></th><th>B</th><th>C</th><th>D</th></tr>
        <tr><th>A</th><td>70</td><td>50</td><td rowspan="3" style="background-color: #e0b0ff;">200</td></tr>
        <tr><th>E</th><td>90</td><td>100</td></tr>
        <tr><th>F</th><td colspan="2" style="text-align: center;">130</td></tr>
        <caption>Distance Between Points</caption>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="login.js"></script>
</body>
</html>
