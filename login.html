<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Mwaki University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-sidebar">
  <header class="top-header">
    <div class="logo-area">
      <img src="multimedia/mwaki_logo.png" alt="Mwaki University Logo" onerror="this.src='https://placehold.co/60x60?text=Mwaki'">
      <h1>MWAKI UNIVERSITY</h1>
    </div>
    <nav class="desktop-nav">
      <a href="home.html">Home</a>
      <a href="faculties.html">Faculties</a>
      <a href="admission.html">Admissions</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="main-wrapper" style="display: flex; gap: 2rem; align-items: flex-start;">
    <!-- Login Form -->
    <div class="form-card" style="flex: 1;">
      <h1 style="color: #1a3f7a; margin-bottom: 2rem;"><i class="fas fa-lock"></i> Login Page</h1>
      <form class="login-form" name="Input" action="details.html" method="get">
        <label for="username">Username</label>
        <input type="text" id="username" name="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label>Skin Complexion</label>
        <div class="checkbox-group">
          <input type="checkbox" name="choice" value="cb1" id="black" checked>
          <label for="black">Black</label>
          <input type="checkbox" name="choice" value="cb2" id="white">
          <label for="white">White</label>
          <input type="checkbox" name="choice" value="cb3" id="asian">
          <label for="asian">Asian</label>
          <input type="checkbox" name="choice" value="cb4" id="arabs">
          <label for="arabs">Arabs</label>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Submit</button>
          <button type="reset" class="btn btn-outline"><i class="fas fa-undo"></i> Reset</button>
        </div>
      </form>
    </div>

    <!-- Table -->
    <div class="card" style="flex: 0.8;">
      <h2>Distance Between Points</h2>
      <table class="example-table">
        <tr><th></th><th>B</th><th>C</th><th>D</th></tr>
        <tr><th>A</th><td>70</td><td>50</td><td rowspan="3" style="background-color: #e0b0ff;">200</td></tr>
        <tr><th>E</th><td>90</td><td>100</td></tr>
        <tr><th>F</th><td colspan="2" style="text-align: center;">130</td></tr>
        <caption>Distance Between Points</caption>
      </table>
    </div>
  </main>
</body>
</html>
